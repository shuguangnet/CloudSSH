<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudSSH 账号设置</title><link rel="stylesheet" href="/page.css"><link rel="stylesheet" href="/mcp/settings.css"><script defer src="/page.js"></script><script defer src="/account/settings.js"></script></head>
<body><main>
<nav class="topbar"><a class="back" href="/" data-i18n="back">返回面板</a><select id="language" aria-label="Language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en-US">English</option></select></nav>
<header class="page-head"><p class="eyebrow">CloudSSH</p><h1 data-i18n="title">管理员账号设置</h1></header>
<p id="message" role="status" aria-live="polite"></p>
<section><form id="account-form">
<label><span data-i18n="username">账号</span><input id="username" name="username" autocomplete="username" minlength="2" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_.@\-]{1,63}" required></label>
<p class="hint" data-i18n="nameHint">账号为 2–64 个字符，可使用字母、数字、点、下划线、@ 和短横线。</p>
<label><span data-i18n="current">当前密码</span><input id="current-password" type="password" autocomplete="current-password" required maxlength="256"></label>
<label><span data-i18n="new">新密码（留空则不修改）</span><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256"></label>
<label><span data-i18n="confirm">确认新密码</span><input id="confirm-password" type="password" autocomplete="new-password" maxlength="256"></label>
<p class="hint" data-i18n="hint">新密码须为 12–256 个字符。更改密码后需重新登录，旧 MCP 令牌也会失效。服务器配置不会删除。</p>
<div class="actions"><button id="save" type="submit" class="primary" data-i18n="save" disabled>保存修改</button></div>
</form></section></main></body></html>
